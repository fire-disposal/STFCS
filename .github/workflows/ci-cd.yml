name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建并部署到生产机'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 24
  IMAGE_REPO: ghcr.io/fire-disposal/stfcs-app
  # 编译期前缀，必须与服务端 BASE_PATH 一致
  VITE_BASE_PATH: /stfcs/

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Run Typecheck
        run: pnpm run typecheck
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm run test

  build:
    name: Build & Push Image
    needs: [validate, test]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Unified App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.unified
          push: true
          build-args: |
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # 缺 secret 直接停在这里，不进 ssh、不重试
      - name: Check secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$SERVER_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$SERVER_USER" ] || missing="$missing SERVER_USER"
          [ -n "$SSH_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing，需要更新 secrets"
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify production access
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -T 5 -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::$SERVER_HOST:22 不可达，需要更新 secrets（SERVER_HOST 应为生产机公网 IP）"
            exit 1
          fi
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 "$SERVER_USER@$SERVER_HOST" true; then
            echo "::error::ssh 登录被拒，需要更新 secrets 或在生产机 authorized_keys 加入 SSH_PRIVATE_KEY 的公钥"
            exit 1
          fi

      # 部署前先在 runner 上跑一遍镜像：base 路径写错会在这里拦住
      - name: Smoke test image
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker run -d --name stfcs-smoke -e BASE_PATH=/stfcs -e PORT=3001 -p 3101:3001 "$IMAGE" >/dev/null
          trap 'docker rm -f stfcs-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3101/health && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3101/health || {
            echo "::error::$IMAGE /health 未就绪"
            docker logs stfcs-smoke
            exit 1
          }
          curl -fsS http://127.0.0.1:3101/stfcs/ | grep -q '"/stfcs/assets/' || {
            echo "::error::$IMAGE 前端未按 VITE_BASE_PATH=/stfcs/ 构建"
            exit 1
          }

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes docker-compose.yml "$SERVER_USER@$SERVER_HOST:/srv/stfcs/docker-compose.yml"
          # 生产机在境内，从 ghcr 直接拉 500MB 实测约 100KB/s；改为 runner 侧取镜像再流式导入
          docker image inspect "$IMAGE" >/dev/null 2>&1 || docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "gunzip | docker load"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" env APP_IMAGE="$IMAGE_REPO" IMAGE_TAG="$IMAGE_TAG" bash -s <<'REMOTE'
          set -euo pipefail
          mkdir -p /srv/stfcs/storage/players /srv/stfcs/storage/assets/ships /srv/stfcs/storage/assets/weapons
          docker compose -f /srv/stfcs/docker-compose.yml up -d
          docker compose -f /srv/stfcs/docker-compose.yml ps
          REMOTE
          running=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "docker inspect -f '{{.Config.Image}}' stfcs-app")
          test "$running" = "$IMAGE" || { echo "::error::stfcs-app 运行中的镜像为 $running"; exit 1; }

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            health=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" 'curl -s -o /dev/null -w "%{http_code}" http://localhost/health' || true)
            page=$(ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" 'curl -s -o /dev/null -w "%{http_code}" http://localhost/stfcs/' || true)
            if [ "$health" = "200" ] && [ "$page" = "200" ]; then
              echo "health=$health stfcs=$page"
              exit 0
            fi
            sleep 5
          done
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "docker logs --tail 50 stfcs-app"
          exit 1
