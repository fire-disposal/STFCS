name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PNPM_VERSION: 10.32.1
  NODE_VERSION: 24
  HOST_PORT: 80
  APP_PORT: 3001
  CORS_ORIGINS: "*"

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Run Typecheck
        run: pnpm run typecheck
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm run test

  prepare:
    name: Prepare Environment
    needs: [validate, test]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      server_image: ${{ steps.set-images.outputs.server_image }}
      client_image: ${{ steps.set-images.outputs.client_image }}
    steps:
      - name: Set image tags
        id: set-images
        run: |
          LOWERED=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "server_image=${LOWERED}-server" >> $GITHUB_OUTPUT
          echo "client_image=${LOWERED}-client" >> $GITHUB_OUTPUT

  build:
    name: Build & Push Image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Unified App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.unified
          push: true
          build-args: |
            VITE_BASE_PATH=/stfcs/
          tags: |
            ${{ env.REGISTRY }}/fire-disposal/stfcs-app:latest
            ${{ env.REGISTRY }}/fire-disposal/stfcs-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 先在 runner 上把"能不能连上"与"能不能登录"分开暴露，避免 heredoc 里静默 5 秒超时
      - name: SSH preflight
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          if ! ssh-keyscan -T 5 -H "$SERVER_HOST" > /tmp/known_hosts 2>/dev/null || [ ! -s /tmp/known_hosts ]; then
            echo "::error::${SERVER_HOST}:22 unreachable from runner (tcp timeout)"
            exit 1
          fi
          cat /tmp/known_hosts >> ~/.ssh/known_hosts
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 "$SERVER_USER@$SERVER_HOST" true; then
            echo "::error::ssh auth failed for ${SERVER_USER}@${SERVER_HOST}; authorized_keys 缺少 SSH_PRIVATE_KEY 对应公钥"
            exit 1
          fi

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_REPO: ${{ env.REGISTRY }}/fire-disposal/stfcs-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
              "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          scp -o BatchMode=yes docker-compose.yml "$SERVER_USER@$SERVER_HOST:/srv/stfcs/docker-compose.yml"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            env APP_IMAGE="$IMAGE_REPO" IMAGE_TAG="$IMAGE_TAG" bash -s <<'EOF'
          set -euo pipefail
          docker pull "$APP_IMAGE:$IMAGE_TAG"
          mkdir -p /srv/stfcs/storage/players /srv/stfcs/storage/assets/ships /srv/stfcs/storage/assets/weapons
          docker compose -f /srv/stfcs/docker-compose.yml up -d
          docker compose -f /srv/stfcs/docker-compose.yml ps
          EOF

      - name: Health Check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          for i in $(seq 1 24); do
            health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${SERVER_HOST}:${{ env.HOST_PORT }}/health" || true)
            page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${SERVER_HOST}:${{ env.HOST_PORT }}/stfcs/" || true)
            if [ "$health" = "200" ] && [ "$page" = "200" ]; then
              echo "health=$health stfcs=$page"
              exit 0
            fi
            sleep 5
          done
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "docker logs --tail 50 stfcs-app"
          exit 1

  # 临时：runner 侧连通性探针，仅 workflow_dispatch 触发
  probe:
    name: Deploy probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "host_chars=${#SERVER_HOST} user_chars=${#SERVER_USER}"
          echo "--- resolve"; getent ahosts "$SERVER_HOST" | head -4 || echo "resolve failed"
          echo "--- tcp"
          for p in 22 80 443; do
            if timeout 6 bash -c "exec 3<>/dev/tcp/$SERVER_HOST/$p" 2>/dev/null; then echo "port $p open"; else echo "port $p blocked"; fi
          done
          echo "--- keyscan"
          ssh-keyscan -T 5 "$SERVER_HOST" 2>&1 | head -3 || true
