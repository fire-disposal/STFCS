# =============================================
# STFCS Docker Compose
# Production Deployment Configuration
# 公网暴露：http://<public-ip>/stfcs/
# =============================================

services:
  app:
    image: ${APP_IMAGE:-stfcs-app}:${IMAGE_TAG:-local}
    container_name: stfcs-app
    restart: unless-stopped
    ports:
      - "80:3001"  # Host 80 -> App 3001
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BASE_PATH=/stfcs
      - CORS_ORIGINS=*
      - LOG_LEVEL=info
    networks:
      - stfcs-network
    volumes:
      # 必须是 packages/server/storage：服务端以 process.cwd() 为根解析 storage
      - /srv/stfcs/storage:/app/packages/server/storage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  stfcs-network:
    driver: bridge
